<!doctype html><html lang="en"><meta charset="utf-8"><title>Recharge hub integration checks</title><style>body{font:16px system-ui;margin:24px;color:#15251d}li{padding:5px}.pass{color:#116c41}.fail{color:#b21d31}iframe{width:390px;height:650px;border:1px solid #ccc}</style><h1>Recharge hub integration checks</h1><button id="run">Run checks</button><ol id="results"></ol><iframe id="app" title="Website under test"></iframe><script type="module">
const results=document.querySelector('#results'),frame=document.querySelector('#app');
const backup=new Map(['cc-locale','cc-recent','cc-consent'].map(k=>[k,localStorage.getItem(k)]));
function assert(value,message){if(!value)throw new Error(message);}
function load(url){return new Promise((resolve,reject)=>{frame.onload=()=>resolve(frame.contentDocument);frame.onerror=reject;frame.src=url;});}
async function check(name,fn){const li=document.createElement('li');try{await fn();li.className='pass';li.textContent='PASS — '+name;}catch(e){li.className='fail';li.textContent='FAIL — '+name+': '+e.message;}results.append(li);}
document.querySelector('#run').onclick=async()=>{results.replaceChildren();try{
 localStorage.setItem('cc-recent','{"invalid":true}');localStorage.setItem('cc-consent','"no"');
 let doc=await load('/en/');const win=frame.contentWindow;
 const input=doc.querySelector('#game-search');const setSearch=value=>{input.value=value;input.dispatchEvent(new win.Event('input',{bubbles:true}));};
 await check('Blocked or malformed storage does not break search',()=>{setSearch('gensh');assert(doc.querySelectorAll('#all-grid .game-card:not([hidden])').length===1,'Partial match failed');});
 await check('Non-Latin aliases and case-insensitive partial names',()=>{for(const q of ['원신','原神','GENSH']){setSearch(q);assert(doc.querySelector('#all-grid .game-card:not([hidden])').dataset.slug==='genshin-impact',q);}});
 await check('Empty results and clear control',()=>{setSearch('doesnotexistxxx');assert(!doc.querySelector('.empty').hidden,'Empty state missing');doc.querySelector('[data-reset]').click();assert(doc.querySelectorAll('#all-grid .game-card:not([hidden])').length===238,'Reset failed');});
 await check('Product category filtering',()=>{doc.querySelector('[data-filter="game-key"]').click();assert(doc.querySelectorAll('#all-grid .game-card:not([hidden])').length===11,'Key count');doc.querySelector('[data-filter="gift-card"]').click();assert(doc.querySelectorAll('#all-grid .game-card:not([hidden])').length===35,'Gift count');doc.querySelector('[data-filter="all"]').click();});
 const events=[];doc.addEventListener('cc:analytics',e=>events.push(e.detail));doc.addEventListener('click',e=>{if(e.target.closest('[data-outbound]'))e.preventDefault();},true);
 await check('TikTok event includes provider, locale, device, page and CTA position',()=>{doc.querySelector('.hero-actions [data-outbound]').click();const e=events.at(-1);assert(e.event==='outbound_recharge_click'&&e.provider==='tiktok'&&e.locale==='en'&&e.device==='mobile'&&e.page==='/en/'&&e.cta_position==='hero','Missing dimensions');assert(e.link_url==='https://www.tiktok.com/coin?rc=MNN8WQ8P','Referral mismatch');assert(win.dataLayer.length===0,'Analytics must not queue network events after decline');});
 await check('Search CTA records correct game and saves a recent selection',()=>{setSearch('tiles');doc.querySelector('#all-grid [data-slug="tiles-survive"] [data-outbound]').click();const e=events.at(-1);assert(e.provider==='lootbar'&&e.game_slug==='tiles-survive'&&e.cta_position==='search','Incorrect game attribution');assert(JSON.parse(localStorage.getItem('cc-recent'))[0]==='tiles-survive','Recent storage');assert(!doc.querySelector('.recent-section').hidden,'Recent section missing');});
 await check('Consent enables the dataLayer adapter without a GA ID',()=>{doc.querySelector('[data-analytics-settings]').click();doc.querySelector('[data-consent="yes"]').click();doc.querySelector('.hero-actions [data-outbound]').click();assert(win.dataLayer.at(-1).provider==='tiktok','No adapter event');doc.querySelector('[data-analytics-settings]').click();doc.querySelector('[data-consent="no"]').click();const count=win.dataLayer.length;doc.querySelector('.hero-actions [data-outbound]').click();assert(count===win.dataLayer.length,'Opt-out did not stop collection');});
 await check('Saved language routes only the root, preserving explicit locale links',async()=>{localStorage.setItem('cc-locale','"ja"');await load('/');await new Promise(resolve=>{if(frame.contentWindow.location.pathname==='/ja/')resolve();else frame.onload=resolve;});assert(frame.contentWindow.location.pathname==='/ja/','Root did not respect preference');await load('/en/');assert(frame.contentWindow.location.pathname==='/en/','Explicit locale was overwritten');});
 await check('Deep-link locale switch preserves the selected game',async()=>{doc=await load('/ko/games/tiles-survive/');assert(doc.querySelector('[data-language="ja"]').getAttribute('href')==='/ja/games/tiles-survive/','Game context lost');assert(doc.querySelector('.product [data-outbound]').dataset.position==='detail_hero','Wrong detail position');});
 await check('404 and legacy redirects',async()=>{let r=await fetch('/wos/',{redirect:'follow'});assert(r.url.endsWith('/en/games/whiteout-survival/'),'Legacy path not preserved');r=await fetch('/missing-page/');assert(r.status===404,'Soft 404');});
}finally{for(const [key,value]of backup){if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}document.body.dataset.done='true';}};
</script></html>
