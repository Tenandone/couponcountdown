<!doctype html><html lang="en"><meta charset="utf-8"><title>Recharge hub integration checks</title><style>body{font:16px system-ui;margin:24px;color:#15251d}li{padding:5px}.pass{color:#116c41}.fail{color:#b21d31}iframe{width:390px;height:650px;border:1px solid #ccc}</style><h1>Recharge hub integration checks</h1><button id="run">Run checks</button><ol id="results"></ol><iframe id="app" title="Website under test"></iframe><script type="module">
const results=document.querySelector('#results'),frame=document.querySelector('#app');
const backup=new Map(['cc-locale','cc-recent','cc-consent'].map(k=>[k,localStorage.getItem(k)]));
function assert(value,message){if(!value)throw new Error(message);}
function load(url){return new Promise((resolve,reject)=>{frame.onload=()=>resolve(frame.contentDocument);frame.onerror=reject;frame.src=url;});}
async function check(name,fn){const li=document.createElement('li');try{await fn();li.className='pass';li.textContent='PASS — '+name;}catch(e){li.className='fail';li.textContent='FAIL — '+name+': '+e.message;}results.append(li);}
document.querySelector('#run').onclick=async()=>{results.replaceChildren();try{
 localStorage.setItem('cc-recent','{"invalid":true}');localStorage.setItem('cc-consent','"no"');
 let doc=await load('/en/?qa=1');const win=frame.contentWindow;
 const input=doc.querySelector('#game-search');const setSearch=value=>{input.value=value;input.dispatchEvent(new win.Event('input',{bubbles:true}));};
 await check('Blocked or malformed storage does not break search',()=>{setSearch('gensh');assert(doc.querySelectorAll('#all-grid .game-card:not([hidden])').length===1,'Partial match failed');});
 await check('Non-Latin aliases and case-insensitive partial names',()=>{for(const q of ['원신','原神','GENSH']){setSearch(q);assert(doc.querySelector('#all-grid .game-card:not([hidden])').dataset.slug==='genshin-impact',q);}});
 await check('Empty results and clear control',()=>{setSearch('doesnotexistxxx');assert(!doc.querySelector('.empty').hidden,'Empty state missing');doc.querySelector('[data-reset]').click();assert(doc.querySelectorAll('#all-grid .game-card:not([hidden])').length===12,'Initial product limit failed');});
 await check('Product category filtering',()=>{doc.querySelector('[data-filter="game-key"]').click();assert(doc.querySelectorAll('#all-grid .game-card:not([hidden])').length===11,'Key count');doc.querySelector('[data-filter="gift-card"]').click();assert(doc.querySelectorAll('#all-grid .game-card:not([hidden])').length===12,'Gift pagination count');doc.querySelector('[data-show-more]').click();assert(doc.querySelectorAll('#all-grid .game-card:not([hidden])').length===35,'Show more lost products');doc.querySelector('[data-filter="all"]').click();});
 const events=[];doc.addEventListener('cc:analytics',e=>events.push(e.detail));doc.addEventListener('click',e=>{if(e.target.closest('[data-outbound]'))e.preventDefault();},true);
 await check('TikTok event includes provider, locale, device, page and CTA position',()=>{doc.querySelector('.hero-actions [data-outbound]').click();const e=events.at(-1);assert(e.event==='outbound_recharge_click'&&e.provider==='tiktok'&&e.locale==='en'&&e.device==='mobile'&&e.page==='/en/'&&e.cta_position==='hero','Missing dimensions');assert(e.link_url==='https://www.tiktok.com/coin?rc=MNN8WQ8P','Referral mismatch');assert(win.dataLayer.length===0,'Analytics must not queue network events after decline');});
 await check('Search CTA records correct game and saves a recent selection',()=>{setSearch('tiles');doc.querySelector('#all-grid [data-slug="tiles-survive"] [data-outbound]').click();const e=events.at(-1);assert(e.provider==='lootbar'&&e.game_slug==='tiles-survive'&&e.cta_position==='search','Incorrect game attribution');assert(JSON.parse(localStorage.getItem('cc-recent'))[0]==='tiles-survive','Recent storage');assert(!doc.querySelector('.recent-section').hidden,'Recent section missing');});
 await check('Consent initializes the restored GA ID once and forwards events',()=>{doc.querySelector('[data-analytics-settings]').click();doc.querySelector('[data-consent="yes"]').click();doc.querySelector('.hero-actions [data-outbound]').click();assert(win.dataLayer.some(x=>x[0]==='config'&&x[1]==='G-1TS6F1NK5K'),'Wrong GA ID');assert(win.dataLayer.at(-1)[1]==='outbound_recharge_click'&&win.dataLayer.at(-1)[2].provider==='tiktok','No gtag event');assert(doc.documentElement.dataset.gaLoads==='1','GA loader must initialize once');doc.querySelector('[data-analytics-settings]').click();doc.querySelector('[data-consent="no"]').click();const count=win.dataLayer.length;doc.querySelector('.hero-actions [data-outbound]').click();assert(count===win.dataLayer.length,'Opt-out did not stop collection');});
 await check('All six requested events and common dimensions',async()=>{doc.querySelector('[data-consent="yes"]').click();setSearch('gensh');await new Promise(r=>setTimeout(r,400));doc.querySelector('[data-position="sticky"]').click();const language=doc.querySelector('[data-language="ja"]');language.addEventListener('click',e=>e.preventDefault());language.click();for(const name of ['tiktok_cta_click','lootbar_click','game_card_click','game_search','language_change','sticky_cta_click']){const e=events.find(x=>x.event===name);assert(e,name);for(const key of ['game','locale','page','cta_position','destination'])assert(key in e,name+':'+key);}doc.querySelector('[data-consent="no"]').click();});
 await check('Saved language routes only the root, preserving explicit locale links',async()=>{localStorage.setItem('cc-locale','"ja"');await load('/');await new Promise(resolve=>{if(frame.contentWindow.location.pathname==='/ja/')resolve();else frame.onload=resolve;});assert(frame.contentWindow.location.pathname==='/ja/','Root did not respect preference');await load('/en/?qa=1');assert(frame.contentWindow.location.pathname==='/en/','Explicit locale was overwritten');});
 await check('Deep-link locale switch preserves the selected game',async()=>{doc=await load('/ko/games/tiles-survive/');assert(doc.querySelector('[data-language="ja"]').getAttribute('href')==='/ja/games/tiles-survive/','Game context lost');assert(doc.querySelector('.product [data-outbound]').dataset.position==='detail_hero','Wrong detail position');});
 await check('404 and legacy redirects',async()=>{let r=await fetch('/wos/',{redirect:'follow'});assert(r.url.endsWith('/en/games/whiteout-survival/'),'Legacy path not preserved');r=await fetch('/missing-page/');assert(r.status===404,'Soft 404');});

 await check('Markets rows, locale context, consent and funnel events',async()=>{
  localStorage.setItem('cc-consent','"no"');doc=await load('/en/markets/?qa=1');
  assert(doc.querySelectorAll('.market-row').length===7,'Missing asset');
  doc.addEventListener('click',e=>{if(e.target.closest('[data-market-event]'))e.preventDefault();},true);
  doc.querySelector('[data-consent="yes"]').click();doc.querySelector('[data-consent="yes"]').click();
  for(const name of ['market_asset_click','markets_to_games_click','markets_to_tiktok_click'])doc.querySelector('[data-market-event="'+name+'"]').click();
  for(const name of ['market_page_view','market_asset_click','markets_to_games_click','markets_to_tiktok_click','outbound_recharge_click'])assert(frame.contentWindow.dataLayer.filter(e=>e[0]==='event'&&e[1]===name).length===1,'Duplicate/missing '+name);
  doc=await load('/ja/markets/bitcoin/?qa=1');assert(doc.querySelector('[data-language="ko"]').getAttribute('href')==='/ko/markets/bitcoin/','Market context lost');
  assert(!doc.querySelector('.mobile-sticky'),'Markets must not overlay a recharge CTA');
 });
 await check('Markets at 320/375/390/430px in every locale',async()=>{
  localStorage.setItem('cc-consent','"no"');
  for(const l of ['ko','en','ja','zh-tw','es-419','es-es','pt-br','ru'])for(const width of [320,375,390,430]){
   frame.style.width=width+'px';doc=await load('/'+l+'/markets/?qa=1');
   assert(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth,l+' hub overflow '+width);
   doc=await load('/'+l+'/markets/usd-krw/?qa=1');assert(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth,l+' detail overflow '+width);
   for(const el of doc.querySelectorAll('main a,main h1,main dd,header .brand'))assert(el.getBoundingClientRect().right<=doc.documentElement.clientWidth+1,l+' clipped '+el.textContent);
  }
  frame.style.width='390px';
 });
 await check('All seven asset routes retain source or explicit pending state',async()=>{
  for(const slug of ['bitcoin','ethereum','sp500','nasdaq','kospi','usd-krw','gold']){
   doc=await load('/ko/markets/'+slug+'/?qa=1');assert(doc.querySelector('h1'),'Missing page');
   assert(doc.querySelector('.market-status'),'Missing data status');assert(doc.querySelector('.market-method'),'Missing methodology');
  }
 });
}finally{for(const [key,value]of backup){if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}document.body.dataset.done='true';}};
</script></html>
