name: Publish weekly market recap
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      refresh:
        description: Re-fetch the completed week for a correction
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: weekly-market-recap
  cancel-in-progress: false
jobs:
  refresh:
    # Review branches can never publish. Explicit opt-in is required after launch review.
    if: github.ref == 'refs/heads/main' && vars.MARKETS_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch and validate (retain verified data for the same week)
        run: npm run markets:fetch
        env:
          MARKETS_REFRESH: ${{ inputs.refresh || 'false' }}
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Prepare existing Pages main-root output
        run: npm run prepare:pages
      - name: Commit generated snapshot without overwriting concurrent changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/markets/weekly-index.json data/markets/weeks dist assets ko en ja zh-tw es-419 es-es pt-br ru sitemap.xml index.html 404.html robots.txt _headers _redirects
          if ! git diff --cached --quiet; then
            git commit -m 'Publish weekly market recap'
            git push origin HEAD:main
          fi
      - name: Request and verify existing GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/request-pages-build.mjs
